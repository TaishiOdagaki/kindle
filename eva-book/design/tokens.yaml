# デザイントークン(v0.1)。図・話数カード・表紙・EPUBのCSSは、すべてここから生成する。
# 色は「巻の識別」に使う。色だけに意味を持たせない(グレースケールでも、ラベル・線種・パターンで区別できる)。
# 作品固有の配色(機体色、黒白のタイトルカード等)に寄せない。三原色(赤・黄・青)は特定の作品の配色ではない中立の色。
# accent=塗り(その上に on_accent の文字)/ accent_dark=白地の上の文字・線・グラフ。

neutrals:
  ink: "#111111"       # 本文・枠線
  mid: "#6b6b6b"       # 補助テキスト
  light: "#c8c8c8"     # 罫線
  pale: "#efefef"      # 弱い塗り
  paper: "#ffffff"

volumes:
  "1":
    name_ja: 赤
    name_en: Red
    accent: "#B5282E"        # 塗り用。白文字を載せる
    accent_dark: "#B5282E"   # 白地の上の文字・線・グラフ用(コントラスト3:1以上)
    tint: "#F2D8D9"          # 淡色(塗り)
    on_accent: "#FFFFFF"
    pattern: solid
    title_ja: 背景とTVシリーズ
    title_en: Context and the Television Series
    rationale: "三原色の最初。入口の巻。作品固有の配色(機体色等)に寄らない中立の色。"
  "2":
    name_ja: 黄
    name_en: Yellow
    accent: "#E3B100"        # 塗り用。黒文字を載せる(白文字は不可)
    accent_dark: "#8A6500"   # 白地の上の文字・線・グラフ用。黄色は白地で視認しにくいため、濃い黄を使う
    tint: "#FAF1D1"
    on_accent: "#111111"
    pattern: hatch
    title_ja: 旧劇場版と新劇場版
    title_en: The 1997 Films and Rebuild
    rationale: "三原色の二番目。グレースケールで第1・第3巻と明度が大きく離れる(明るい灰色)。"
  "3":
    name_ja: 青
    name_en: Blue
    accent: "#1B3F7A"
    accent_dark: "#1B3F7A"
    tint: "#D6DCE7"
    on_accent: "#FFFFFF"
    pattern: dots
    title_ja: 解釈・英語圏・FAQ
    title_en: Interpretation, the English-Speaking World, and FAQ
    rationale: "三原色の三番目。落ち着いた濃い青で、解釈と議論の巻に合う。"

figure:
  width_px: 1600
  min_font_pt: 11
  corner_radius: 0.08

typography:
  image_font: IPAexGothic    # 図・カード・表紙の書体(作品のタイトルカード風の書体は使わない)
